<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found – Bigyan Rawal</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: inherit; }
:root { color-scheme: light; --bg: #ECECEA; --ink: #0E0E0D; --muted: #5E5E58; --brass: #5B7D12;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --bg: #121211; --ink: #ECECE6; --muted: #A2A29A; --brass: #A9C45E; } }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1.0625rem/1.6 "Inter", system-ui, sans-serif; display: grid; place-items: center; padding: 24px; }
main { max-width: 34rem; }
.code { color: var(--brass); font-weight: 600; }
h1 { margin: 12px 0 14px; font: 400 clamp(2.4rem, 8vw, 4rem)/1.05 "Playfair Display", Georgia, serif; }
p { color: var(--muted); margin: 0 0 28px; }
a { display: inline-block; padding: .85em 1.5em; background: var(--ink); color: var(--bg); text-decoration: none; font-weight: 600; }
a:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="code">Error 404</p>
  <h1>This room isn’t on the plan.</h1>
  <p>The page may have moved, or the link may be mistyped. Everything else is on the home page.</p>
  <a href="/">Go to the home page</a>
</main>
</body>
</html>
